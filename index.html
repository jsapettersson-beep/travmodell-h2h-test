<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Travmodell 2.0 – H2H behörighetstest</title><style>body{font:16px system-ui;background:#141a20;color:#f4f6f8;max-width:550px;margin:30px auto;padding:18px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;margin:8px 0;border-radius:8px}input{background:#26323e;color:white;border:1px solid #74818d}button{background:#207454;color:white;border:0}button:disabled{opacity:.5}pre{white-space:pre-wrap;background:#26323e;padding:14px;border-radius:8px}small{color:#b5c1cb}</style></head><body><h2>Travmodell 2.0 – H2H behörighetstest</h2><p>Endast inloggning och lästest. Inga workers eller scheman startas.</p><label>E-post<input id="email" type="email" autocomplete="username"></label><label>Lösenord<input id="pass" type="password" autocomplete="current-password"></label><label>Avdelning<select id="race" style="box-sizing:border-box;width:100%;font:inherit;padding:14px;margin:8px 0;border-radius:8px;background:#26323e;color:white"><option value="b1763492-dd1c-4b7e-86af-ea160d239d6e">V64-1 (12 november)</option><option value="0f03963d-c5ee-4c15-91bc-532f5e9b9b0c">V64-2</option><option value="c1f4a39e-a771-4da6-872d-8746323d07d6">V64-3</option><option value="d50d06d5-4295-4ff3-94a0-ecb561499a40">V64-4</option><option value="29820c61-e195-444b-8b22-43e6756043c4">V64-5</option><option value="64cde266-e441-4b52-abbe-4e503ce3026c">V64-6</option></select></label><button id="test">Logga in och testa</button><button id="out" style="background:#48515b">Logga ut</button><pre id="result" aria-live="polite">Inget test utfört.</pre><small>Dela endast HTTP-statusen med ChatGPT. Dela aldrig lösenord eller token.</small><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const base='https://kdorqppajsaqidsvtcaa.supabase.co',key="sb_publishable_GQs9L0B5nDHiCl914PHUHA_wGjdX3nE";
const s=createClient(base,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const result=document.querySelector('#result'),button=document.querySelector('#test');
button.onclick=async()=>{button.disabled=true;result.textContent='Testar...';try{
const {data,error}=await s.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#pass').value});
document.querySelector('#pass').value='';
if(error||!data.session){result.textContent='Inloggningen misslyckades: '+(error?.message||'ingen session');return;}
const r=await fetch(base+'/functions/v1/trav-dashboard-h2h-read-v1',{method:'POST',headers:{'Authorization':'Bearer '+data.session.access_token,'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({race_id:document.querySelector('#race').value})});
if(r.ok){const data=await r.json();const labels=data?.status_labels;result.textContent='HTTP 200 – Dashboardläsning godkänd\n'+(labels?'Hästunderlag verifierat: '+labels.horse_material.verified+'/'+labels.horse_material.total+'\nStartlista: '+(labels.startfield?.message||'Status saknas')+'\nH2H-worker: '+labels.h2h_worker.status+'\nH2H-granskning inför grov: '+labels.h2h_review.verified+'/'+labels.h2h_review.total+' ('+labels.h2h_review.status+')':'Statusuppgifter saknas i svaret');}else{result.textContent='HTTP '+r.status+'\n'+(r.status===403?'Åtkomst nekad enligt behörighetsregeln':r.status===401?'Autentiseringen avvisades':'Oväntat svar');}
}catch(e){result.textContent='Nätverksfel: '+String(e)}finally{button.disabled=false}};
document.querySelector('#out').onclick=async()=>{await s.auth.signOut();document.querySelector('#pass').value='';result.textContent='Utloggad';};
</script></body></html>
